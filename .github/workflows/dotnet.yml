# This workflow will build a .NET project and perform a Sonar scan with code coverage using Coverlet

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Begin Sonar scan
      run: dotnet sonarscanner begin /k:"hkeasv_BusCompany_DataDrivenTesting" /d:sonar.token="SonarQubeCloudHK" /d:sonar.cs.opencover.reportsPaths=coverage.xml
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --no-incremental
    - name: Collect code coverage using Coverlet
      run: coverlet .\BusCompany.UnitTests\bin\Debug\net10.0\BusCompany.UnitTests.dll --target "dotnet" --targetargs "test --no-build" -f=opencover -o="coverage.xml"
    - name: End Sonar scan
      run: dotnet sonarscanner end /d:sonar.token="SonarQubeCloudHK"
